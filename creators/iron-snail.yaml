# Ask The Iron Snail
#
# Everything creator-specific lives here. The engine in askthe/ never assumes a
# creator, niche or platform. See docs/ARCHITECTURE.md#creator-config.

slug: iron-snail
display_name: The Iron Snail
instance_name: Ask The Iron Snail
platform: youtube
channel_url: https://www.youtube.com/@TheIronSnail
niche: men's clothing and gear
tagline: Heritage clothing and gear, tested for years
links:
  - label: YouTube
    url: https://www.youtube.com/@TheIronSnail
  - label: The Iron Snail store
    url: https://theironsnail.us
about: >-
  Long-form reviews of boots, denim, waxed jackets, knitwear and t-shirts: how
  they're made, how they wear in, and which are worth the money. Many products
  come back years later, so his views change, and every answer here says when.

# How answers name the creator. Answers are always third person.
refer_to_creator_as: The Iron Snail
pronoun: he

categories:
  - jackets
  - coats
  - fleece
  - denim
  - chinos
  - boots
  - shoes
  - knitwear
  - sweatshirts
  - t-shirts
  - shirts
  - underwear
  - accessories

# The ~50 videos chosen for the Phase 1 prototype, one YouTube ID per line.
video_selection: iron-snail.videos.txt

# Known names and how auto-captions mangle them. Grows as videos are processed:
# entity resolution proposes entries, a person approves them.
# Seeded from the three transcripts tested while designing the data model.
# Shown on the ask page; from real fan comments, lightly shortened.
starter_questions:
  - "1907 vs the 875s? What's the difference?"
  - "What's the best budget t-shirt?"
  - "Should I treat my boots out of the box?"
