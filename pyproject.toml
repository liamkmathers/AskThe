[project]
name = "askthe"
version = "0.1.0"
description = "Turn a creator's videos into a cited, searchable knowledge base of their verdicts."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.0",
    "fastapi>=0.115",
    "numpy>=2.0",
    "openai>=1.50",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    "uvicorn>=0.30",
    "youtube-transcript-api>=1.2",
    "yt-dlp>=2025.1.1",
]

[project.scripts]
askthe = "askthe.cli:app"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
