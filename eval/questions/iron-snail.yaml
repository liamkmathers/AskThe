- id: q10
  question: "Did Levi's quality go downhill?"
  source: paraphrase of a common Reddit question
  type: change_of_mind
  expected:
    covered: full
    sources: [nM_g-z5zLJ0]
  notes: >-
    2023: "do they make Levi's like they used to? The answer has to be no", but the gap
