- id: q01
  question: "should I treat my boots out of box ? Annnnd how often should I treat them ?"
  source: https://www.youtube.com/watch?v=H6lDr__B3GM
  type: how_to
  expected:
    covered: full
    sources: [H6lDr__B3GM, 4cRAkEHfXKo]
  notes: >-
    2019: Blundstone says most of its boots are pre-treated, so not out of the box (his
    pair looked dry, the exception). 2022: how often is "when I feel like they need
    it", use your intuition; he admits he probably does it too little. Two parts, both
    answered.

- id: q02
  question: "So if I buy the levis 501 shrink to fit will they get tighter after washing?"
  source: https://www.youtube.com/watch?v=5cpsrt14fkc
  type: lookup
  expected:
    covered: full
    must_mention: ["shrink"]
    sources: [5cpsrt14fkc, JcDBrIvLD_8]
  notes: Yes, STF shrinks on the first soak; he soaked his and in 2021 says size up two in the waist.

- id: q03
  question: "I'm usually a 33x30 in Levi's 502s, what size should I buy in these? [501 STF]"
  source: https://www.youtube.com/watch?v=vXHDbKKuXQ0
  type: lookup
  expected:
    covered: partial
    sources: [JcDBrIvLD_8, vXHDbKKuXQ0]
  notes: >-
    His rule (2021): size up two in the waist and one to two in length for STF. He never
    compares 502 sizing, so no invented conversion; partial is right.

- id: q04
  question: "Why do you cuff your jeans?"
  source: https://www.youtube.com/watch?v=5cpsrt14fkc
  type: taste
  expected:
    covered: full
    sources: [5cpsrt14fkc, vXHDbKKuXQ0]
  notes: >-
    Length is "first and foremost": too long looks bad (2019). In 2020 he cuffed anyway
    because his style doesn't suit uncuffed wide-legged pants. His taste, said plainly.

