- id: k14
  question: "A genuine question: if a wok doesn't build up layers of polymers like a cast iron, what does it mean for a wok to build up seasoning?"
  source: https://www.youtube.com/watch?v=3kdkPUmrc20
  type: technique
  expected:
    covered: full
    sources: [bXwLmZBa0Lo]
  notes: >-
    Polymer layers struggle on a wok: it gets very hot, the metal flexes between the hot
    bottom and cooler sides so layers flake, and acidic sauces strip them. His account of
    what wok seasoning is instead, as he says it.

