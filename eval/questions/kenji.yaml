# counts as a gate.
#
# Five questions are fans' own, read out in his "Ask Kenji Anything" episodes (k01–k03,
# k09) or posted on his videos (none yet: his comments aren't fetched). The rest are
# written to match what cooking fans ask. Expected answers come from reading the
