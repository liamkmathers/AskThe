# AskThe application config.
#
# Each [adapters.<port>] table picks the implementation behind one interface in
# askthe/core/interfaces.py. `use` names an adapter registered in askthe/wiring.py;
# any other keys are passed to that adapter as options.
#
# Swapping a component (a different database, transcript source, search engine or
# LLM) means changing `use` here, and adding the adapter if it doesn't exist yet.

data_dir = "data"
creators_dir = "creators"

[adapters.catalog]
use = "yt-dlp"

[adapters.transcripts]
# Or use = "files" to read data/transcripts/<video_id>.vtt, .srt or .txt instead.
use = "youtube-transcript-api"
languages = ["en"]

[adapters.comments]
# Viewers' comments, for collecting real fan questions (M4). Like fetch, needs YouTube.
use = "yt-dlp"

[adapters.raw_archive]
use = "files"

[adapters.profiles]
# Profiles are kept as files (data/<creator>/profiles/) so the database can be rebuilt
# without paying for them again (D17).
use = "files"

[adapters.store]
use = "sqlite"

[adapters.search]
use = "sqlite"

[adapters.embedder]
# "openai" reads ASKTHE_OPENAI_API_KEY (or OPENAI_API_KEY); "memory" is the test fake.
use = "openai"
model = "text-embedding-3-small"

[adapters.vectors]
use = "sqlite"

[adapters.llm]
# "anthropic" calls Claude and reads ASKTHE_ANTHROPIC_API_KEY (or ANTHROPIC_API_KEY);
# "memory" is the scripted test fake.
use = "anthropic"
# Effort per task: low | medium | high | xhigh | max. Extraction is judgement-heavy.
effort = { understand = "high", plan = "low", rerank = "low", answer = "high" }

# Model per task. Model names live here, never in code.
[models]
understand = "claude-opus-5-5"
plan = "claude-haiku-5-5"    # quick query expansion
rerank = "claude-haiku-5-5"  # scoring many short passages
answer = "claude-opus-5-5"

# How answers choose what to read. "hybrid": plan, keyword + vector search, rerank,
# then the relevant sections. "full": whole transcripts (all of them if they fit).
[retrieval]
mode = "hybrid"
context_words = 12000

# Prices in US dollars per million tokens, for the costs `askthe eval` reports.
# cache_write is the 5-minute cache rate. Check against the provider's price list.
[prices."claude-opus-5-5"]
input = 4.00
output = 20.00
cache_read = 0.20
cache_write = 5.00

[prices."claude-haiku-5-5"]
input = 0.10
output = 0.50
cache_read = 0.01
cache_write = 0.125
